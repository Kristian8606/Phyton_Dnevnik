name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test application
        run: python -m unittest discover -s tests
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (python -c "from cash_ledger import __version__; print(__version__)").Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match the version v$version."
          }
          python packaging/build_app.py
          if ($LASTEXITCODE -ne 0) { throw 'Application bundling failed.' }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $compiler)) { throw "Inno Setup not found at $compiler." }
          & $compiler "/DAppVersion=$version" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
      - name: Check installation and data preservation
        shell: pwsh
        run: |
          $installer = Get-ChildItem installers/Dnevnik-*-windows-x64.exe | Select-Object -First 1
          if (!$installer) { throw 'Installer file missing.' }
          $targetDir = Join-Path $env:RUNNER_TEMP 'ledger-install-check'
          $sqliteFile = Join-Path $env:LOCALAPPDATA 'Dnevnik\dnevnik.sqlite3'
          $installArgs = @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $targetDir + '"')
          )
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          function InstallAndCheck {
            $install = Start-Process -FilePath $installer.FullName -Wait -PassThru -ArgumentList $installArgs
            if ($install.ExitCode -ne 0) { throw "Installer returned $($install.ExitCode)." }
            $app = Start-Process -FilePath (Join-Path $targetDir 'Dnevnik.exe') -Wait -PassThru -ArgumentList '--check-startup'
            if ($app.ExitCode -ne 0 -or !(Test-Path -LiteralPath $sqliteFile)) {
              throw "Packaged application failed its startup check. Exit code $($app.ExitCode)."
            }
          }
          python -c "from cash_ledger.data_location import LEGACY_DIRECTORY_NAME; from cash_ledger.ledger import Ledger; from datetime import date; from pathlib import Path; import sys; Ledger(Path(sys.argv[1]) / LEGACY_DIRECTORY_NAME / 'cash-ledger.sqlite3').save(date.today(), {'income': '137'})" $env:LOCALAPPDATA
          if ($LASTEXITCODE -ne 0) { throw 'Could not seed the legacy test database.' }
          InstallAndCheck
          python -c "from cash_ledger.ledger import Ledger; from datetime import date; from pathlib import Path; import sys; ledger = Ledger(Path(sys.argv[1])); assert ledger.day(date.today()).summary['cash'] == 13700; ledger.save(date.today(), {'income': '23'})" $sqliteFile
          if ($LASTEXITCODE -ne 0) { throw 'Could not migrate the test database.' }
          InstallAndCheck
          python -c "from cash_ledger.ledger import Ledger; from datetime import date; from pathlib import Path; import sys; assert Ledger(Path(sys.argv[1])).day(date.today()).summary['cash'] == 16000" $sqliteFile
          if ($LASTEXITCODE -ne 0) { throw 'The installation did not preserve the test records.' }
      - uses: actions/upload-artifact@v6
        with:
          name: Dnevnik-windows-x64
          path: installers/Dnevnik-*-windows-x64.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windows-release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Dnevnik-windows-x64
          path: installers
      - name: Publish verified installer to private Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          filename="Dnevnik-${TAG#v}-windows-x64.exe"
          installer="installers/$filename"
          test -s "$installer"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > release.json; then
            if jq -e '.isDraft' release.json > /dev/null; then
              gh release upload "$TAG" "$installer" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            else
              jq -e --arg name "$filename" 'any(.assets[]; .name == $name)' release.json > /dev/null
            fi
          else
            gh release create "$TAG" "$installer" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Дневник ${TAG#v}" --notes "Windows x64 installer"
          fi
