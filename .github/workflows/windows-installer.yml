name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test application
        run: python -m unittest discover -s tests
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (python -c "from cash_ledger import __version__; print(__version__)").Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match the version v$version."
          }
          python packaging/build_app.py
          if ($LASTEXITCODE -ne 0) { throw 'Application bundling failed.' }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $compiler)) { throw "Inno Setup not found at $compiler." }
          & $compiler "/DAppVersion=$version" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
      - name: Check installation and data preservation
        shell: pwsh
        run: |
          $installer = Get-ChildItem installers/Dnevnik-*-windows-x64.exe | Select-Object -First 1
          if (!$installer) { throw 'Installer file missing.' }
          $targetDir = Join-Path $env:RUNNER_TEMP 'ledger-install-check'
          $sqliteFile = Join-Path $env:LOCALAPPDATA 'Dnevnik\dnevnik.sqlite3'
          $archiveDir = Join-Path $targetDir 'Архиви'
          $backupFile = Join-Path $archiveDir 'Автоматичен архив.sqlite3'
          $installArgs = @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $targetDir + '"')
          )
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          function InstallAndCheck {
            $install = Start-Process -FilePath $installer.FullName -Wait -PassThru -ArgumentList $installArgs
            if ($install.ExitCode -ne 0) { throw "Installer returned $($install.ExitCode)." }
            $app = Start-Process -FilePath (Join-Path $targetDir 'Dnevnik.exe') -Wait -PassThru -ArgumentList '--check-startup'
            if ($app.ExitCode -ne 0) {
              throw "Packaged application failed its startup check. Exit code $($app.ExitCode)."
            }
          }
          python -c "from cash_ledger.data_location import LEGACY_DIRECTORY_NAME; from cash_ledger.ledger import Ledger; from datetime import date; from pathlib import Path; import sys; Ledger(Path(sys.argv[1]) / LEGACY_DIRECTORY_NAME / 'cash-ledger.sqlite3').save(date.today(), {'income': '137'})" $env:LOCALAPPDATA
          if ($LASTEXITCODE -ne 0) { throw 'Could not seed the legacy test database.' }
          InstallAndCheck
          python -c "from cash_ledger.ledger import Ledger; from datetime import date; from pathlib import Path; import sys; path = Path(sys.argv[1]); assert path.is_file(); assert Ledger(path).day(date.today()).summary['cash'] == 13700" $backupFile
          if ($LASTEXITCODE -ne 0) { throw 'The installer did not archive the legacy data.' }
          python -c "from cash_ledger.data_location import default_database; from cash_ledger.ledger import Ledger; from datetime import date; from pathlib import Path; import sys; path = Path(sys.argv[1]); assert default_database(path.parent) == path and path.is_file(); ledger = Ledger(path); assert ledger.day(date.today()).summary['cash'] == 13700; ledger.save(date.today(), {'income': '23'})" $sqliteFile
          if ($LASTEXITCODE -ne 0) { throw 'Could not migrate the test database.' }
          $appPath = Join-Path $targetDir 'Dnevnik.exe'
          $previous = Start-Process -FilePath $appPath -PassThru
          $updateArgs = $installArgs + @('/SP-', '/NOCLOSEAPPLICATIONS', "/DnevnikParent=$($previous.Id)")
          $update = Start-Process -FilePath $installer.FullName -PassThru -ArgumentList $updateArgs
          try {
            Start-Sleep -Seconds 2
            if ($previous.HasExited -or $update.HasExited) { throw 'The update did not wait for the running application.' }
            Stop-Process -Id $previous.Id
            if (!$update.WaitForExit(120000) -or $update.ExitCode -ne 0) {
              throw 'The in-app installation did not complete.'
            }
            $reopened = Get-Process -Name Dnevnik -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -eq $appPath -and $_.Id -ne $previous.Id }
            if (!$reopened) { throw 'The application was not reopened after the update.' }
            $reopened | Stop-Process
          }
          finally {
            if (!$previous.HasExited) { Stop-Process -Id $previous.Id }
            if (!$update.HasExited) { Stop-Process -Id $update.Id }
          }
          python -c "from cash_ledger.ledger import Ledger; from datetime import date; from pathlib import Path; import sys; assert Ledger(Path(sys.argv[1])).day(date.today()).summary['cash'] == 16000" $sqliteFile
          if ($LASTEXITCODE -ne 0) { throw 'The installation did not preserve the test records.' }
          python -c "from cash_ledger.ledger import Ledger; from datetime import date; from pathlib import Path; import sys; path = Path(sys.argv[1]); assert path.is_file(); assert Ledger(path).day(date.today()).summary['cash'] == 16000" $backupFile
          if ($LASTEXITCODE -ne 0) { throw 'The update did not replace the archive with the latest stored data.' }
          $archives = @(Get-ChildItem -LiteralPath $archiveDir -Force)
          if ($archives.Count -ne 1 -or $archives[0].FullName -ne $backupFile) {
            throw 'The update left extra archive files behind.'
          }
          $archiveHash = (Get-FileHash -LiteralPath $backupFile).Hash
          $applicationHash = (Get-FileHash -LiteralPath $appPath).Hash
          $savedDb = "$sqliteFile.before-corruption-test"
          Move-Item -LiteralPath $sqliteFile -Destination $savedDb
          try {
            Set-Content -LiteralPath $sqliteFile -Value 'invalid SQLite data'
            $failedInstall = Start-Process -FilePath $installer.FullName -Wait -PassThru -ArgumentList $installArgs
            if ($failedInstall.ExitCode -eq 0) { throw 'Setup continued without a valid archive.' }
            if ((Get-FileHash -LiteralPath $backupFile).Hash -ne $archiveHash) { throw 'The previous archive changed.' }
            if ((Get-FileHash -LiteralPath $appPath).Hash -ne $applicationHash) { throw 'Setup replaced the existing app.' }
          }
          finally {
            Move-Item -LiteralPath $savedDb -Destination $sqliteFile -Force
          }
      - uses: actions/upload-artifact@v6
        with:
          name: Dnevnik-windows-x64
          path: installers/Dnevnik-*-windows-x64.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windows-release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Dnevnik-windows-x64
          path: installers
      - name: Publish the verified installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          filename="Dnevnik-${TAG#v}-windows-x64.exe"
          installer="installers/$filename"
          test -s "$installer"
          sha256="sha256:$(sha256sum "$installer" | cut -d' ' -f1)"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json apiUrl,isDraft > release.json; then
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Дневник ${TAG#v}" -f body="Windows x64 installer" -F draft=true || true
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json apiUrl,isDraft > release.json
          fi
          assets_api="$(jq -er '.apiUrl | sub("^https://api.github.com/"; "")' release.json)/assets"
          verified_asset() {
            gh api "$assets_api" | jq -e --arg name "$filename" --arg sha256 "$sha256" \
              'any(.[]; .name == $name and .state == "uploaded" and .digest == $sha256)' > /dev/null
          }
          if ! verified_asset; then
            jq -e '.isDraft' release.json > /dev/null
            gh release upload "$TAG" "$installer" --repo "$GITHUB_REPOSITORY" --clobber || true
            for delay in 2 5 10; do
              if verified_asset; then
                break
              fi
              sleep "$delay"
            done
            verified_asset
          fi
          if jq -e '.isDraft' release.json > /dev/null; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
