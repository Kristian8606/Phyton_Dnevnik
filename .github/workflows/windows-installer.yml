name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test application
        run: python -m unittest discover -s tests
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (python -c "from cash_ledger import __version__; print(__version__)").Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match the version v$version."
          }
          python packaging/build_app.py
          if ($LASTEXITCODE -ne 0) { throw 'Application bundling failed.' }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $compiler)) { throw "Inno Setup not found at $compiler." }
          & $compiler "/DAppVersion=$version" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
      - name: Check installation and data preservation
        shell: pwsh
        run: |
          $installer = Get-ChildItem installers/KasovDnevnik-*-windows-x64.exe | Select-Object -First 1
          if (!$installer) { throw 'Installer file missing.' }
          $targetDir = Join-Path $env:RUNNER_TEMP 'ledger-install-check'
          $sqliteFile = Join-Path $env:LOCALAPPDATA 'KasovDnevnik\cash-ledger.sqlite3'
          $installArgs = @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $targetDir + '"')
          )
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          function InstallAndCheck {
            $install = Start-Process -FilePath $installer.FullName -Wait -PassThru -ArgumentList $installArgs
            if ($install.ExitCode -ne 0) { throw "Installer returned $($install.ExitCode)." }
            $app = Start-Process -FilePath (Join-Path $targetDir 'KasovDnevnik.exe') -Wait -PassThru -ArgumentList '--check-startup'
            if ($app.ExitCode -ne 0 -or !(Test-Path -LiteralPath $sqliteFile)) {
              throw "Packaged application failed its startup check. Exit code $($app.ExitCode)."
            }
          }
          InstallAndCheck
          python -c "from cash_ledger.ledger import Ledger; from datetime import date; from pathlib import Path; import sys; Ledger(Path(sys.argv[1])).save(date.today(), {'income': '137'})" $sqliteFile
          if ($LASTEXITCODE -ne 0) { throw 'Could not seed the test database.' }
          InstallAndCheck
          python -c "from cash_ledger.ledger import Ledger; from datetime import date; from pathlib import Path; import sys; assert Ledger(Path(sys.argv[1])).day(date.today()).summary['cash'] == 13700" $sqliteFile
          if ($LASTEXITCODE -ne 0) { throw 'The installation did not preserve the test records.' }
      - uses: actions/upload-artifact@v4
        with:
          name: KasovDnevnik-windows-x64
          path: installers/KasovDnevnik-*-windows-x64.exe
          if-no-files-found: error
